# [refactor jun12 P0.1] CI gate — first automation this repo has had.
# Gates: architecture ratchets, typecheck, unit tests, production build, and a blocking
# no-growth lint baseline. Ordinary lint debt remains honestly frozen at 60 errors / 54 warnings;
# cleanup passes and can lower the future ceiling, while growth fails. Node is PINNED to 20 to match
# Dockerfile (node:20-alpine); vitest is known-broken under node 24 (ERR_INTERNAL_ASSERTION).
# Deploys stay manual (deploy.sh, owner-run) — CI is the gate, not the trigger.
name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # [P0.3] real postgres for route and migration-boundary tests. Local runs
      # keep the :5433 bp_test default; CI overrides both guarded test URLs.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # route tests must never silently skip in CI
      BP_REQUIRE_TEST_DB: "1"
      # Admin connection for isolated migration-boundary databases. This matches
      # the postgres service above; production DATABASE_URL is never consulted.
      BP_TEST_ADMIN_URL: postgresql://ci:ci@localhost:5432/postgres
      BP_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Build-time placeholders. DATABASE_URL is also the localhost-only CI test
      # database; production values come from Secrets Manager at runtime.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-dummy-secret-not-real
      AUTH_SECRET: ci-dummy-secret-not-real
      NEXTAUTH_URL: http://localhost:3000
      S3_BUCKET: ci-dummy-bucket
      CLOUDFRONT_DOMAIN: ci.invalid
      AWS_REGION: us-east-1
      STEP_FUNCTION_ARN: arn:aws:states:us-east-1:000000000000:stateMachine:ci-dummy
      PROCESSING_WEBHOOK_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: npm ci
      - name: terraform format
        run: terraform fmt -check -recursive infrastructure/terraform
      - name: terraform initialize without backend
        run: terraform -chdir=infrastructure/terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform -chdir=infrastructure/terraform validate
      - name: architecture guardrails
        run: npm run check:architecture
      - name: project security policy
        run: npm run check:project-security-policy
      - name: schema cutover policy
        run: npm run check:schema-cutover
      - name: typecheck
        run: npx tsc --noEmit
      - name: script tests
        run: npm run test:scripts
      - name: unit tests
        run: npm test
      - name: build
        run: npm run build

  lint:
    # Blocking no-growth ratchet over the accepted 60-error / 54-warning baseline.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:lint-baseline

  # [P5 / DR016 V-L5] Golden e2e paths — the end-to-end invariant heartbeat (demo-never-writes,
  # draw→reload persistence, promote/delete survival, sidebar search) that previously ran only
  # in local close batteries. Self-contained: playwright.config webServer array boots the
  # cdn-stub (:9876) + next dev (:3100) with dummy AWS env; global-setup migrates + seeds the
  # :5433 test DB and generates the gitignored synthetic PDF. No secrets, no YOLO weights.
  golden-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bp_test
          POSTGRES_PASSWORD: bp_test
          POSTGRES_DB: bp_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Override playwright.config's devcontainer-path fallback (absent on runners).
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --no-shell
      - name: golden e2e (SOLO, offline over cdn-stub + seeded test DB)
        run: npm run e2e -- golden-paths.spec.ts
